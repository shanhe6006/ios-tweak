name: build-ios-dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Write sources
        run: |
          mkdir -p src
          cat > src/Hider.m <<'HIDER_EOF'
          //
          //  Hider.m
          //  扫描窗口视图树，按文字内容隐藏“评价”“更多”这类按钮。
          //  结果会在屏幕底部显示一行调试信息：标签数 / 隐藏数，
          //  用来判断这些按钮是原生 UIView 还是 Unity 自己画的。
          //

          #import <UIKit/UIKit.h>

          static UILabel *gDebug = nil;
          static NSUInteger gLabelCount = 0;
          static NSUInteger gHiddenCount = 0;
          static NSMutableArray<NSString *> *gFoundTexts = nil;

          static BOOL textMatches(NSString *text) {
              if (text.length == 0) return NO;
              NSArray *keys = @[@"评价", @"更多", @"Rate", @"Review", @"More"];
              for (NSString *k in keys) {
                  if ([text containsString:k]) return YES;
              }
              return NO;
          }

          static void walkView(UIView *v) {
              if (!v) return;

              if ([v isKindOfClass:[UILabel class]]) {
                  UILabel *lab = (UILabel *)v;
                  gLabelCount++;
                  if (lab.text.length) {
                      [gFoundTexts addObject:lab.text];
                  }
                  if (textMatches(lab.text)) {
                      // 往上找按钮祖先，找到就连底图一起隐藏
                      UIView *target = lab;
                      UIView *p = lab.superview;
                      for (int i = 0; i < 4 && p; i++) {
                          if ([p isKindOfClass:[UIControl class]] || [p isKindOfClass:[UIButton class]]) {
                              target = p;
                              break;
                          }
                          p = p.superview;
                      }
                      target.hidden = YES;
                      gHiddenCount++;
                  }
              }

              for (UIView *sub in v.subviews) {
                  walkView(sub);
              }
          }

          static void scanAll(void) {
              gLabelCount = 0;
              gHiddenCount = 0;
              [gFoundTexts removeAllObjects];

              NSArray<UIWindow *> *wins = nil;
              if (@available(iOS 13.0, *)) {
                  NSMutableArray *list = [NSMutableArray array];
                  for (UIScene *scene in [UIApplication sharedApplication].connectedScenes) {
                      if (![scene isKindOfClass:[UIWindowScene class]]) continue;
                      for (UIWindow *w in ((UIWindowScene *)scene).windows) {
                          [list addObject:w];
                      }
                  }
                  wins = list;
              }
              if (wins.count == 0) {
                  wins = [UIApplication sharedApplication].windows;
              }

              for (UIWindow *w in wins) {
                  walkView(w);
              }

              if (gDebug) {
                  NSString *extra = @"";
                  if (gLabelCount > 0 && gHiddenCount == 0) {
                      extra = [NSString stringWithFormat:@" | %@", [gFoundTexts componentsJoinedByString:@","]];
                      if (extra.length > 60) extra = [extra substringToIndex:60];
                  }
                  gDebug.text = [NSString stringWithFormat:@"labels=%lu hidden=%lu%@",
                                 (unsigned long)gLabelCount, (unsigned long)gHiddenCount, extra];
              }
          }

          __attribute__((constructor))
          static void hider_init(void) {
              gFoundTexts = [NSMutableArray array];

              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(3.0 * NSEC_PER_SEC)),
                             dispatch_get_main_queue(), ^{
                  UIWindow *win = nil;
                  for (UIWindow *w in [UIApplication sharedApplication].windows) {
                      if (w.isKeyWindow) { win = w; break; }
                  }
                  if (!win) win = [UIApplication sharedApplication].keyWindow;
                  if (!win) return;

                  UILabel *lab = [[UILabel alloc] initWithFrame:CGRectMake(0, 0, 340, 22)];
                  lab.backgroundColor = [UIColor colorWithWhite:0.0 alpha:0.55];
                  lab.textColor = [UIColor yellowColor];
                  lab.font = [UIFont fontWithName:@"Menlo" size:11];
                  if (!lab.font) lab.font = [UIFont systemFontOfSize:11];
                  lab.text = @"scanning...";
                  lab.userInteractionEnabled = NO;
                  [win addSubview:lab];
                  gDebug = lab;

                  // 居中放到底部
                  lab.center = CGPointMake(win.bounds.size.width / 2, win.bounds.size.height - 24);
              });

              // 前 15 秒反复扫描（标题界面可能在切场景后重建）
              for (int i = 0; i < 15; i++) {
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)((3.0 + i) * NSEC_PER_SEC)),
                                 dispatch_get_main_queue(), ^{
                      scanAll();
                  });
              }
          }
          HIDER_EOF
          cat > src/FPSOverlay.m <<'FPS_EOF'
          //
          //  FPSOverlay.m
          //  在游戏画面左上角显示实时帧率，右下角一个小按钮可以隐藏/显示。
          //  原理：hook 掉 EAGLContext 的 presentRenderbuffer:（游戏用 OpenGL ES，
          //  每次真正把画面提交到屏幕都会调用它），统计每秒调用次数 = 真实帧率。
          //

          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>
          #import <OpenGLES/EAGL.h>
          #import <objc/runtime.h>

          static volatile NSUInteger gFrameCount = 0;
          static UILabel *gLabel = nil;
          static UIButton *gToggleBtn = nil;
          static BOOL gVisible = YES;

          #pragma mark - hook

          @interface EAGLContext (FPSHook)
          - (BOOL)fps_presentRenderbuffer:(NSUInteger)target;
          @end

          @implementation EAGLContext (FPSHook)
          - (BOOL)fps_presentRenderbuffer:(NSUInteger)target {
              gFrameCount = gFrameCount + 1;
              return [self fps_presentRenderbuffer:target];
          }
          @end

          static void installSwizzle(void) {
              Class cls = objc_getClass("EAGLContext");
              if (cls == Nil) return;
              Method orig = class_getInstanceMethod(cls, @selector(presentRenderbuffer:));
              Method repl = class_getInstanceMethod(cls, @selector(fps_presentRenderbuffer:));
              if (orig && repl) {
                  method_exchangeImplementations(orig, repl);
              }
          }

          #pragma mark - UI

          static UIWindow *keyWindow(void) {
              UIWindow *win = nil;
              if (@available(iOS 13.0, *)) {
                  for (UIScene *scene in [UIApplication sharedApplication].connectedScenes) {
                      if (![scene isKindOfClass:[UIWindowScene class]]) continue;
                      for (UIWindow *w in ((UIWindowScene *)scene).windows) {
                          if (w.isKeyWindow) { win = w; break; }
                      }
                      if (win) break;
                  }
              }
              if (!win) {
                  for (UIWindow *w in [UIApplication sharedApplication].windows) {
                      if (w.isKeyWindow) { win = w; break; }
                  }
              }
              if (!win) win = [UIApplication sharedApplication].keyWindow;
              return win;
          }

          static void makeUI(void) {
              UIWindow *win = keyWindow();
              if (!win) return;

              UILabel *lab = [[UILabel alloc] initWithFrame:CGRectMake(14, 44, 120, 26)];
              lab.text = @"-- FPS";
              lab.textColor = [UIColor colorWithRed:0.4 green:1.0 blue:0.4 alpha:1.0];
              lab.backgroundColor = [UIColor colorWithWhite:0.0 alpha:0.45];
              lab.font = [UIFont fontWithName:@"Menlo-Bold" size:15];
              if (!lab.font) lab.font = [UIFont boldSystemFontOfSize:15];
              lab.textAlignment = NSTextAlignmentCenter;
              lab.layer.cornerRadius = 6;
              lab.layer.masksToBounds = YES;
              lab.userInteractionEnabled = NO;
              [win addSubview:lab];
              gLabel = lab;

              UIButton *btn = [UIButton buttonWithType:UIButtonTypeCustom];
              btn.frame = CGRectMake(14, 78, 54, 30);
              btn.backgroundColor = [UIColor colorWithWhite:0.0 alpha:0.45];
              btn.layer.cornerRadius = 6;
              btn.titleLabel.font = [UIFont boldSystemFontOfSize:13];
              [btn setTitle:@"隐藏" forState:UIControlStateNormal];
              [btn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              [btn addTarget:nil action:@selector(fpsToggleTapped:) forControlEvents:UIControlEventTouchUpInside];
              objc_setAssociatedObject(btn, "fps", @"1", OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              [win addSubview:btn];
              gToggleBtn = btn;
          }

          #pragma mark - toggle action

          @interface NSObject (FPSToggle)
          - (void)fpsToggleTapped:(id)sender;
          @end

          @implementation NSObject (FPSToggle)
          - (void)fpsToggleTapped:(id)sender {
              gVisible = !gVisible;
              gLabel.hidden = !gVisible;
              [gToggleBtn setTitle:(gVisible ? @"隐藏" : @"显示") forState:UIControlStateNormal];
          }
          @end

          #pragma mark - constructor

          __attribute__((constructor))
          static void fps_init(void) {
              installSwizzle();

              dispatch_async(dispatch_get_main_queue(), ^{
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(2.0 * NSEC_PER_SEC)),
                                 dispatch_get_main_queue(), ^{
                      makeUI();
                  });
              });

              NSTimer *timer = [NSTimer timerWithTimeInterval:1.0 repeats:YES block:^(NSTimer *t) {
                  static NSUInteger last = 0;
                  NSUInteger now = gFrameCount;
                  NSUInteger delta = now - last;
                  last = now;
                  UILabel *lab = gLabel;
                  if (lab) {
                      lab.text = [NSString stringWithFormat:@"%lu FPS", (unsigned long)delta];
                  }
              }];
              [[NSRunLoop mainRunLoop] addTimer:timer forMode:NSRunLoopCommonModes];
          }
          FPS_EOF
          wc -l src/*.m

      - name: Build dylibs
        run: |
          set -e
          mkdir -p out
          xcodebuild -version
          for NAME in Hider FPSOverlay; do
            echo "=== $NAME ==="
            xcrun --sdk iphoneos clang \
              -arch arm64 -dynamiclib -O2 -fobjc-arc \
              -miphoneos-version-min=12.0 \
              -install_name "@executable_path/$NAME.dylib" \
              -framework UIKit -framework Foundation -framework QuartzCore -framework OpenGLES \
              -o "out/$NAME.dylib" "src/$NAME.m"
            xcrun lipo -info "out/$NAME.dylib"
          done
          ls -la out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ios-dylibs
          path: out/*.dylib
          if-no-files-found: error
